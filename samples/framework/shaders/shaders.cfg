# The shaders of the sample framework's renderer: the FleX demo's (reference/flex/demo/d3d/shaders/Shaders.cfg),
# without the ImGui pair (the framework draws its UI with Donut's ImGui pass) and without the async compute
# benchmark's mesh pixel shader (the benchmark is not ported).
#
# Compiled by ethereal_compile_shaders (samples/framework/CMakeLists.txt) at shader model 6.0 to DXIL and SPIR-V,
# and at 5.0 to DXBC when the aggregate builds the D3D11 backend. ShaderTool names a blob
# <source stem>_<entry point>.bin.
#
# Changes to the sources beyond a provenance header (the porting record; every other line is FleX's):
#   meshVS.hlsl             viewLightDir takes .xyz of the float4 it is computed as (the implicit truncation FXC
#                           and DXC warn about; the same value)
#   ellipsoidDepthVS.hlsl   solveQuadratic zeroes minT and maxT on entry: FleX had that line commented out, and
#   ellipsoidDepthPS.hlsl   with no real root the vertex shader passed uninitialised bounds to the geometry
#                           shader (an undefined quad; DXC warns). Zero bounds give a degenerate quad, nothing
#                           drawn. In the pixel shader the values are never used when there is no root (discard);
#                           the line (FleX's, under #if 0 there) only silences the warning.
#   passThroughVS.hlsl      the input is the attributes the shader reads: the position and the texture coordinate
#   pointThicknessVS.hlsl   of MeshVertexIn, the position of FluidVertexIn. nvrhi numbers the Vulkan input locations
#                           by attribute and the validation layer reports attributes a shader does not consume,
#                           while D3D11 refuses a layout without an attribute the signature declares (FleX's D3D11
#                           layouts bound all four)
#
# '#' at the start of a line is the only comment form.

blurDepthPS.hlsl                                 -T ps -E blurDepthPS
compositePS.hlsl                                 -T ps -E compositePS
debugLinePS.hlsl                                 -T ps -E debugLinePS
debugLineVS.hlsl                                 -T vs -E debugLineVS
diffuseGS.hlsl                                   -T gs -E diffuseGS
diffusePS.hlsl                                   -T ps -E diffusePS
diffuseVS.hlsl                                   -T vs -E diffuseVS
ellipsoidDepthGS.hlsl                            -T gs -E ellipsoidDepthGS
ellipsoidDepthPS.hlsl                            -T ps -E ellipsoidDepthPS
ellipsoidDepthVS.hlsl                            -T vs -E ellipsoidDepthVS
meshPS.hlsl                                      -T ps -E meshPS
meshShadowPS.hlsl                                -T ps -E meshPS_Shadow
meshVS.hlsl                                      -T vs -E meshVS
passThroughVS.hlsl                               -T vs -E passThroughVS
pointGS.hlsl                                     -T gs -E pointGS
pointPS.hlsl                                     -T ps -E pointPS
pointShadowPS.hlsl                               -T ps -E pointShadowPS
pointThicknessGS.hlsl                            -T gs -E pointThicknessGS
pointThicknessPS.hlsl                            -T ps -E pointThicknessPS
pointThicknessVS.hlsl                            -T vs -E pointThicknessVS
pointVS.hlsl                                     -T vs -E pointVS
