# The kernels of ethereal_phys: one row per kernel source and entry point.
#
# Compiled by ethereal_compile_shaders (engine/CMakeLists.txt) at shader model 6.0 to DXIL and SPIR-V, and
# at cs_5_0 to DXBC when the aggregate builds the D3D11 backend. ShaderTool names a blob
# <source stem>_<entry point>.bin; a row with -D axes becomes one blob holding every permutation.
#
# Permutation axes (both must stay in one row per kernel: two rows with the same source and entry point
# would overwrite each other):
#
#   -D EPHYS_WAVE={0,1}    1 = the SM 6.0 wave-intrinsics reduction (WaveReduce.hlsli), selected on devices
#                          with nvrhi::Feature::WaveLaneCountMinMax; 0 = the groupshared tree.
#   -D NVFLEX_XPBD={0,1}   1 = the XPBD kernel (KernelId::<Name>XPBD), 0 = the PBD kernel (KernelId::<Name>).
#
# engine/src/kernel_table.inl is generated from this file and the sources by gen_kernel_table.py; run it
# after changing a row or a resource declaration (the ethereal_phys_kernel_table test checks it). The order
# of the rows is the order of ephys::KernelId (engine/include/ethereal/phys/kernels.h).
#
# '#' at the start of a line is the only comment form.

ClearInt.hlsl                                       -T cs -E ClearInt
ClearFloat4.hlsl                                    -T cs -E ClearFloat4
#
bvh/ComputeTotalBounds.hlsl                         -T cs -E ComputeTotalBounds -D EPHYS_WAVE={0,1}
bvh/ComputeTotalBoundsGroup.hlsl                    -T cs -E ComputeTotalBoundsGroup -D EPHYS_WAVE={0,1}
bvh/ComputeTotalBoundsFinalize.hlsl                 -T cs -E ComputeTotalBoundsFinalize
bvh/CalculateMortonCodes.hlsl                       -T cs -E CalculateMortonCodes
bvh/CalculateKeyDeltas.hlsl                         -T cs -E CalculateKeyDeltas
bvh/BuildLeaves.hlsl                                -T cs -E BuildLeaves
bvh/BuildHierarchy.hlsl                             -T cs -E BuildHierarchy
bvh/ComputeTotalInvEdges.hlsl                       -T cs -E ComputeTotalInvEdges
#
radixSort1CS.hlsl                                   -T cs -E radixSort1CS
radixSort2CS.hlsl                                   -T cs -E radixSort2CS
radixSort3CS.hlsl                                   -T cs -E radixSort3CS
radixSortBlockCS.hlsl                               -T cs -E radixSortBlockCS
#
CalculateBounds.hlsl                                -T cs -E CalculateBounds -D EPHYS_WAVE={0,1}
CalculateBoundsGroup.hlsl                           -T cs -E CalculateBoundsGroup -D EPHYS_WAVE={0,1}
CalculateBoundsFinalize.hlsl                        -T cs -E CalculateBoundsFinalize -D EPHYS_WAVE={0,1}
CalculateInflatableVolume.hlsl                      -T cs -E CalculateInflatableVolume -D EPHYS_WAVE={0,1} -D NVFLEX_XPBD={0,1}
SolveInflatableVolume.hlsl                          -T cs -E SolveInflatableVolume
SolveSprings.hlsl                                   -T cs -E SolveSprings
SolveSpringsXPBD.hlsl                               -T cs -E SolveSpringsXPBD
#
UpdateTriangles.hlsl                                -T cs -E UpdateTriangles
UpdateVertexNormals.hlsl                            -T cs -E UpdateVertexNormals
UpdateTrianglesInit.hlsl                            -T cs -E UpdateTrianglesInit
UpdateVertexNormalsInit.hlsl                        -T cs -E UpdateVertexNormalsInit
NormalizeVertexNormals.hlsl                         -T cs -E NormalizeVertexNormals
CalculateVorticity.hlsl                             -T cs -E CalculateVorticity
CalculateParticleHash.hlsl                          -T cs -E CalculateParticleHash
Predict.hlsl                                        -T cs -E Predict
CreateGrid.hlsl                                     -T cs -E CreateGrid
ClearCellBuckets.hlsl                               -T cs -E ClearCellBuckets
ReorderParticles.hlsl                               -T cs -E ReorderParticles
CompactDiffuseParticles.hlsl                        -T cs -E CompactDiffuseParticles
ComputeTriangleBounds.hlsl                          -T cs -E ComputeTriangleBounds
ContinuousShockPropagation.hlsl                     -T cs -E ContinuousShockPropagation
#
CollideParticles.hlsl                               -T cs -E CollideParticles
CollideShapes.hlsl                                  -T cs -E CollideShapes
CollideTriangles.hlsl                               -T cs -E CollideTriangles
ApplyDeltas.hlsl                                    -T cs -E ApplyDeltas
CalculateAnisotropy.hlsl                            -T cs -E CalculateAnisotropy
CalculateDensity.hlsl                               -T cs -E CalculateDensity
CalculateDensitySurfaceTension.hlsl                 -T cs -E CalculateDensitySurfaceTension
ClampDiffuseParticleCount.hlsl                      -T cs -E ClampDiffuseParticleCount
CreateDiffuseParticles.hlsl                         -T cs -E CreateDiffuseParticles
Finalize.hlsl                                       -T cs -E Finalize
SmoothPositions.hlsl                                -T cs -E SmoothPositions
SolveContactsAccumulate.hlsl                        -T cs -E SolveContactsAccumulate
SolveContactsAveraged.hlsl                          -T cs -E SolveContactsAveraged
SolveContactsSequential.hlsl                        -T cs -E SolveContactsSequential
SolveDensities.hlsl                                 -T cs -E SolveDensities
SolveDensitiesNonFluid.hlsl                         -T cs -E SolveDensitiesNonFluid
SolveDensitiesSurfaceTension.hlsl                   -T cs -E SolveDensitiesSurfaceTension
SolveShapes.hlsl                                    -T cs -E SolveShapes -D EPHYS_WAVE={0,1} -D NVFLEX_XPBD={0,1}
SolveShapesPlasticDeformation.hlsl                  -T cs -E SolveShapesPlasticDeformation -D EPHYS_WAVE={0,1} -D NVFLEX_XPBD={0,1}
SolveVelocities.hlsl                                -T cs -E SolveVelocities
SpringsGenerateIndices.hlsl                         -T cs -E SpringsGenerateIndices
SpringsParticleRange.hlsl                           -T cs -E SpringsParticleRange
SpringsReorder.hlsl                                 -T cs -E SpringsReorder
TransformShapeBounds.hlsl                           -T cs -E TransformShapeBounds
UpdateDiffuseParticles.hlsl                         -T cs -E UpdateDiffuseParticles
UpdateVelocities.hlsl                               -T cs -E UpdateVelocities
#
ProbeKernelParams.hlsl                              -T cs -E ProbeKernelParams -D NVFLEX_XPBD={0,1}
#
# The extension layer (ext/force_field.h): FleX's force field kernel of its extension library.
ext/UpdateForceFields.hlsl                          -T cs -E UpdateForceFields
